services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: optimizer
      POSTGRES_PASSWORD: optimizer
      POSTGRES_DB: optimizer_demo
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: optimizer
      MYSQL_DATABASE: optimizer_demo
      MYSQL_USER: optimizer
      MYSQL_PASSWORD: optimizer
    ports: ["3306:3306"]
    volumes: ["mysqldata:/var/lib/mysql"]

volumes:
  pgdata:
  mysqldata:
